services:

  postgres:
    image: postgres:15-alpine
    container_name: documind_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret123}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d documind"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - documind


  qdrant:
    image: qdrant/qdrant:latest
    container_name: documind_qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - documind


  ollama:
    image: ollama/ollama:latest
    container_name: documind_ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - documind


  ollama-init:
    image: ollama/ollama:latest
    container_name: documind_ollama_init

    depends_on:
      ollama:
        condition: service_healthy

    entrypoint: ["/bin/sh", "-c"]

    command: >
      ollama pull nomic-embed-text &&
      echo "Embedding model downloaded."

    environment:
      OLLAMA_HOST: http://ollama:11434

    restart: "no"

    networks:
      - documind


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: documind_backend

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://admin:${DB_PASSWORD:-secret123}@postgres:5432/documind
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-120b
      EMBEDDING_MODEL: nomic-embed-text

      VECTOR_DIM: 768
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 50
      MAX_CONTEXT_CHUNKS: 6

      UPLOAD_DIR: /app/uploads
      DEBUG: "false"

    volumes:
      - uploads_data:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - documind


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: documind_frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"

    networks:
      - documind


networks:
  documind:
    driver: bridge


volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  uploads_data: